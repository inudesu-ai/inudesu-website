<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0e27"/>
  
  <!-- Ring (circle with gradient) -->
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Ring outer -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#ringGradient)" stroke-width="3"/>
  
  <!-- Ring inner -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#ringGradient)" stroke-width="1" opacity="0.5"/>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="6" fill="#00d9ff"/>
  
  <!-- Four legs (robot) at bottom -->
  <line x1="35" y1="70" x2="35" y2="85" stroke="#00d9ff" stroke-width="2"/>
  <line x1="45" y1="70" x2="45" y2="85" stroke="#00d9ff" stroke-width="2"/>
  <line x1="55" y1="70" x2="55" y2="85" stroke="#00d9ff" stroke-width="2"/>
  <line x1="65" y1="70" x2="65" y2="85" stroke="#00d9ff" stroke-width="2"/>
</svg>
